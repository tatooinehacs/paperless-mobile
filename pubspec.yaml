name: paperless_mobile
description: An (almost) fully fledged mobile paperless-ng*x client.

publish_to: "none"

version: 4.5.0+710

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  permission_handler: ^12.0.1
  pdf: ^3.10.2
  edge_detection:
    git:
      url: https://github.com/sawankumarbundelkhandi/edge_detection
      ref: master
  flutter_doc_scanner: ^0.0.21
  path_provider: ^2.0.10
  image: ^4.0.17
  photo_view: ^0.15.0
  intl: ^0.20.0
  flutter_svg: ^2.0.7
  url_launcher: ^6.1.2
  file_picker: ^10.3.3
  web_socket_channel: ^3.0.3
  http: ^1.1.2
  flutter_cache_manager: ^3.3.0
  cached_network_image: ^3.2.1
  shimmer: ^3.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  flutter_form_builder: ^10.2.0
  package_info_plus: ^9.0.0
  local_auth: ^2.1.2
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.2.11
  share_plus: ^12.0.0
  introduction_screen: ^4.0.0
  listen_sharing_intent: ^1.9.2
  uuid: ^4.1.0
  flutter_typeahead: ^5.0.1
  fluttertoast: ^9.0.0
  hive_ce: ^2.13.2
  rxdart: ^0.28.0
  badges: ^3.1.2
  flutter_colorpicker: ^1.0.3
  provider: ^6.0.5
  dio: ^5.9.0
  hydrated_bloc: ^10.1.1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  collection: ^1.17.0
  device_info_plus: ^12.1.0
  flutter_local_notifications: ^19.4.2
  responsive_builder: ^0.7.0
  flutter_displaymode: ^0.6.0
  dynamic_color: ^1.5.4
  flutter_html: ^3.0.0-alpha.6
  freezed_annotation: ^3.1.0
  animations: ^2.0.7
  hive_ce_flutter: ^2.3.2
  flutter_secure_storage: ^9.2.4
  sliver_tools: ^0.2.10
  webview_flutter: ^4.2.1
  printing: ^5.11.1
  go_router: ^16.2.4
  fl_chart: ^1.1.1
  palette_generator_master: ^1.0.1
  defer_pointer: ^0.0.2
  transparent_image: ^2.0.1
  flutter_animate: ^4.2.0+1
  shared_preferences: ^2.2.1
  flutter_markdown_community: ^0.7.7+2
  logger: ^2.0.2+1
  synchronized: ^3.1.0
  extended_masked_text: ^3.0.1
  font_awesome_flutter: ^10.6.0
  pdfx: ^2.9.2
  markdown: ^7.1.1
  path: ^1.9.1
  bloc: ^9.0.1
  mime: ^2.0.0
  copy_with_extension: ^10.0.0
  crypto: ^3.0.6
  cached_query_flutter: ^3.3.4
  skeletonizer: ^2.1.0+1
  pinput: ^6.0.0
  infinite_scroll_pagination: ^5.1.1
  fpdart: ^1.2.0
  open_file: ^3.5.11
  jiffy: ^6.4.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  dependency_validator: ^5.0.2
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  freezed: ^3.2.3
  hive_ce_generator: ^1.9.3
  go_router_builder: ^4.1.0
  flutter_gen_runner: ^5.3.2
  mockito: ^5.5.0
  copy_with_extension_gen: ^10.0.0

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - test/fixtures/
    - test/fixtures/documents/
    - test/fixtures/correspondents/
    - test/fixtures/tags/
    - test/fixtures/preview/
    - test/fixtures/document_types/
    - assets/changelogs/
    - assets/example/

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

flutter_native_splash:
  image: assets/logos/paperless_logo_green.png
  color: "#f9f9f9"
  image_dark: assets/logos/paperless_logo_white.png
  color_dark: "#181818"

flutter_intl:
  enabled: false
